# One service account per workload. None of the workloads calls the Kubernetes API, so no token is mounted and no
# Role is bound to any of them (least privilege = no API permission at all).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: sentinel
automountServiceAccountToken: false
---
