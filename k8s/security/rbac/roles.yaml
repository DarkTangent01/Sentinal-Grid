# Human access, namespace-scoped, no wildcards. Bind your identity provider's groups to these names.
#   sentinel-operator: read-only view of workloads, logs and events (no Secrets, no exec, no port-forward)
#   sentinel-deployer: roll out workloads, ConfigMaps, Services, NetworkPolicies and Jobs; cannot read Secrets
#   sentinel-secret-admin: create / rotate only the three Sentinel Secrets (separate from deploy rights)
# Nobody gets pods/exec here: exec into a container that holds secrets is a cluster-admin break-glass action.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-operator
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - services
  - endpoints
  - events
  - persistentvolumeclaims
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-deployer
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  - statefulsets/scale
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - ''
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - events
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-secret-admin
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - sentinel-app-secrets
  - sentinel-db-secrets
  - sentinel-web-tls
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-operator
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: sentinel-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-deployers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-deployer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: sentinel-deployers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-secret-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-secret-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: sentinel-secret-admins
