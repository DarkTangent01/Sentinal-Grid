apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog
  labels:
    app.kubernetes.io/name: syslog
    app.kubernetes.io/component: siem-ingestion
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syslog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syslog
        app.kubernetes.io/component: siem-ingestion
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: syslog
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: syslog
        image: sentinel/backend:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.syslog_server
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/db_app_password
        - name: CLICKHOUSE_PASSWORD_FILE
          value: /run/secrets/clickhouse_app_password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 64Mi
          limits:
            cpu: '3'
            memory: 2Gi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: deadletter
          mountPath: /var/lib/siem/deadletter
        ports:
        - name: relay
          containerPort: 5515
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/syslog.heartbeat')<30 else 1)
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          initialDelaySeconds: 30
        readinessProbe:
          tcpSocket:
            port: relay
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: secrets
        secret:
          secretName: sentinel-app-secrets
          defaultMode: 288
