# Database migrations (PostgreSQL / Alembic and ClickHouse), run before each rollout of new images:
#   kubectl -n sentinel delete job migrate --ignore-not-found && kubectl apply -k <overlay> && kubectl -n sentinel wait --for=condition=complete job/migrate
# Additive migrations only (project rule); the API refuses to start against a schema that is behind.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sentinel
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: sentinel
    spec:
      restartPolicy: Never
      serviceAccountName: migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: sentinel/backend:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.migrate
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/db_app_password
        - name: CLICKHOUSE_PASSWORD_FILE
          value: /run/secrets/clickhouse_app_password
        - name: BOOTSTRAP_ADMIN_PASSWORD_FILE
          value: /run/secrets/bootstrap_admin_password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: secrets
        secret:
          secretName: sentinel-app-secrets
          defaultMode: 288
          items:
          - key: db_app_password
            path: db_app_password
          - key: clickhouse_app_password
            path: clickhouse_app_password
          - key: bootstrap_admin_password
            path: bootstrap_admin_password
