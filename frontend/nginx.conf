# Reverse proxy + static frontend. TLS certificate/key are mounted at /etc/nginx/certs. nginx runs unprivileged:
# it listens on 8080 / 8443 inside the container; the host publishes them as 80 / 443 (docker-compose.yml).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

# slow-client / oversized-request limits (the API takes small JSON bodies; uploads are not part of the UI)
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 60s;
keepalive_timeout 30s;
large_client_header_buffers 4 16k;

server {
    listen 8080;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    include /etc/nginx/conf.d/upstream.inc;   # resolver + api address: differs between Compose and Kubernetes
    http2 on;
    ssl_certificate     /etc/nginx/certs/siem.crt;
    ssl_certificate_key /etc/nginx/certs/siem.key;
    # Mozilla "intermediate": TLS 1.2 with forward-secret AEAD ciphers only, TLS 1.3 (its ciphers are not configurable)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;            # tickets keyed by a never-rotated key would undo forward secrecy
    limit_conn perip 50;

    # Security headers: SPA locations include security_headers.inc; /api/ responses carry the backend's own headers
    # (main.py), so only HSTS is added there.

    client_max_body_size 1m;
    # UI releases (frontend/publish-ui.sh): index.html from the current release, hashed assets from the shared pool so a
    # browser still on the previous release can load its chunks after a switch
    root /srv/ui/current;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    # Device Access Gateway (the "access" service): its REST API and the terminal WebSocket (long-lived)
    location /api/nms/access/ {
        limit_req zone=api burst=60 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/conf.d/proxy_access.inc;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    # nothing hidden or generated for debugging is served (.git, .env, source maps if a build ever emits them)
    location ~ /\. { return 404; }
    location ~ \.map$ { return 404; }
    location /assets/ {
        root /srv/ui;
        expires 30d;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-store";
    }
}
