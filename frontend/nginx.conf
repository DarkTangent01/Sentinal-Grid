# Reverse proxy + static frontend. TLS certificate/key are mounted at /etc/nginx/certs.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
server_tokens off;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker's embedded DNS (see proxy_params.inc)
    resolver_timeout 3s;
    http2 on;
    ssl_certificate     /etc/nginx/certs/siem.crt;
    ssl_certificate_key /etc/nginx/certs/siem.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers: SPA locations include security_headers.inc; /api/ responses carry the backend's own headers
    # (main.py), so only HSTS is added there.

    client_max_body_size 1m;
    root /usr/share/nginx/html;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /assets/ {
        expires 30d;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-store";
    }
}
