# Main configuration for nginx running as an unprivileged user (uid 101) on a read-only root filesystem.
# Replaces the image's /etc/nginx/nginx.conf: no "user" directive, pid and temporary files in /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # no request bodies or credentials in the access log: method, path (query strings stripped), status, size, timing
    map $request_uri $path_only { "~^(?<p>[^?]*)" $p; default $request_uri; }
    # WebSocket upgrade for the device-access terminal (proxy_access.inc)
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    log_format main '$remote_addr - [$time_iso8601] "$request_method $path_only $server_protocol" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
