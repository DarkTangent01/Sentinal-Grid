# FortiGate SIEM syslog ingress.
#
# Owns the published syslog port (514 on the host -> 5514 here) and is NOT rebuilt or restarted by code deploys, so
#   * UDP senders keep a valid connection-tracking entry (recreating the container that owns the port changes its IP
#     and silently black-holes a long-lived UDP flow until the entry expires), and
#   * nothing is lost while the SIEM's syslog service restarts: messages queue here (memory, spilling to disk) and are
#     forwarded when it is back.
# Each message is forwarded unchanged, prefixed with the sender's IP, over TCP with octet-counted framing; the SIEM
# accepts these relay frames only from this container (SYSLOG_RELAY_HOSTS).
# The in-memory part of the queue is capped at 100k messages (~150 MB); a backlog beyond that goes to disk (8 GB), so a
# slow or stopped SIEM can never push rsyslogd past the container memory limit.

global(
  workDirectory="/var/spool/rsyslog"
  maxMessageSize="64k"
  parser.escapeControlCharactersOnReceive="off"
  processInternalMessages="on"
)

module(load="imudp" threads="2")
module(load="imtcp" maxSessions="512")
module(load="omstdout")
module(load="impstats" interval="300" format="cee" resetCounters="on" ruleset="stats")

input(type="imudp" port="5514" rcvbufSize="16m" ruleset="relay")
input(type="imtcp" port="5514" supportOctetCountedFraming="on" ruleset="relay")

template(name="relay" type="string" string="%fromhost-ip% %rawmsg%")

ruleset(name="relay") {
  action(type="omfwd" name="to_siem" target="syslog" port="5515" protocol="tcp" tcp_framing="octet-counted" template="relay"
         queue.type="LinkedList" queue.size="100000" queue.dequeueBatchSize="2048"
         queue.filename="siem_fwd" queue.maxDiskSpace="8g" queue.saveOnShutdown="on" queue.highWatermark="80000" queue.lowWatermark="20000"
         action.resumeRetryCount="-1" action.resumeInterval="2")
}

# queue / input counters every 5 minutes (docker logs ingress)
ruleset(name="stats") { action(type="omstdout") }

# rsyslog's own messages (errors, forwarding suspended/resumed)
action(type="omstdout")
