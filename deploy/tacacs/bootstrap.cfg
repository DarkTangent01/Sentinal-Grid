#!/usr/local/sbin/tac_plus-ng
# Bootstrap configuration installed on first start: no devices are defined, so every connection is rejected.
# The SIEM replaces this file through the deploy agent once a configuration version is approved.
id = spawnd {
	background = no
	listen { port = 49 }
	spawn {
		instances min = 1
		instances max = 8
	}
}

id = tac_plus-ng {
	# same log formats as the SIEM renders (app/tacacs/parse.py FIELDS), so bootstrap logs are ingested correctly
	log tacauthc {
		destination = /tacacs/logs/authc.log
		timestamp = RFC5424
		authentication format = "${msgid}${FS}${session.id}${FS}${device.address}${FS}${device.name}${FS}${user}${FS}${device.port}${FS}${client}${FS}${result}${FS}${action}${FS}${priv-lvl}${FS}${profile}${FS}${rule}${FS}${server.address}${FS}${identity-source}${FS}${hint}"
	}
	log tacauthz {
		destination = /tacacs/logs/authz.log
		timestamp = RFC5424
		authorization format = "${msgid}${FS}${session.id}${FS}${device.address}${FS}${device.name}${FS}${user}${FS}${device.port}${FS}${client}${FS}${result}${FS}${service}${FS}${priv-lvl}${FS}${profile}${FS}${rule}${FS}${server.address}${FS}${cmd}${FS}${args,|}"
	}
	log tacacct {
		destination = /tacacs/logs/acct.log
		timestamp = RFC5424
		accounting format = "${msgid}${FS}${session.id}${FS}${device.address}${FS}${device.name}${FS}${user}${FS}${device.port}${FS}${client}${FS}${accttype}${FS}${service}${FS}${priv-lvl}${FS}${profile}${FS}${rule}${FS}${server.address}${FS}${cmd}${FS}${args,|}"
	}
	log tacconn {
		destination = /tacacs/logs/conn.log
		timestamp = RFC5424
		connection format = "${msgid}${FS}${accttype}${FS}${conn.protocol}${FS}${peer.address}${FS}${peer.port}${FS}${server.address}${FS}${server.port}"
	}
	authentication log = tacauthc
	authorization log = tacauthz
	accounting log = tacacct
	connection log = tacconn
}
