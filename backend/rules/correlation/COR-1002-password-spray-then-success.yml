id: COR-1002
name: Password spraying followed by a successful login
description: >
  One source address failed to log in to many different accounts and then logged in successfully to one of them:
  a common password tried across accounts until one worked.
version: 1
severity: high
confidence: high
category: credential_access
author: sentinel
log_source: {category: system}
detection:
  selection: {action: logon-fail, src_ip: {exists: true}, user: {exists: true}}
  condition: {group_by: [src_ip], distinct_count: {field: user, threshold: 8}, timeframe: 30m}
  followed_by:
    selection: {action: [logon, privileged-logon]}
    within: 30m
explanation: "{src_ip}: failed logins to {metric} different accounts in {timeframe}, then a successful login; accounts: {samples}"
data_sources: [Authentication logs with the client address and the account name]
falsepositives:
  - A shared jump host or NAT address many users log in from
  - A misconfigured service cycling through accounts
investigation:
  - Identify the account that logged in and disable or reset it
  - Check whether the source is a shared gateway (allowlist its address if so)
  - Search for the same source across other log sources
mitre: {tactic: TA0006, techniques: [T1110.003]}
tests:
  - name: ten accounts tried, one works
    events:
      - {action: logon-fail, src_ip: 203.0.113.60, user: {ipseq: ["user", 1, 10]}, at: "-10m"}
      - {action: logon, src_ip: 203.0.113.60, user: user7, at: "-1m"}
    expect_alerts: 1
  - name: one account, many failures is not spraying
    events:
      - {action: logon-fail, src_ip: 203.0.113.60, user: alice, repeat: 40, at: "-10m"}
      - {action: logon, src_ip: 203.0.113.60, user: alice, at: "-1m"}
    expect_alerts: 0
  - name: spraying with no success
    events: [{action: logon-fail, src_ip: 203.0.113.60, user: {ipseq: ["user", 1, 20]}, at: "-10m"}]
    expect_alerts: 0
